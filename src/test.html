<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>API 测试</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .ok { color: green; }
    .error { color: red; }
    pre { background: #f5f5f5; padding: 10px; }
  </style>
</head>
<body>
  <h1>留白 API 测试</h1>
  <div id="results"></div>

  <script>
    const results = document.getElementById('results');

    function log(msg, isError = false) {
      const div = document.createElement('div');
      div.className = isError ? 'error' : 'ok';
      div.textContent = msg;
      results.appendChild(div);
    }

    async function testAPI() {
      // 测试1: 检查API_BASE配置
      const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
        ? location.protocol + '//' + location.hostname + ':3001'
        : '';

      log('当前 hostname: ' + location.hostname);
      log('当前 API_BASE: ' + API_BASE);

      // 测试2: 健康检查
      try {
        log('\n测试 /api/health...');
        const resp = await fetch(API_BASE + '/api/health', { signal: AbortSignal.timeout(3000) });
        const data = await resp.json();
        log('✅ 健康检查成功: ' + JSON.stringify(data));
      } catch (e) {
        log('❌ 健康检查失败: ' + e.message, true);
      }

      // 测试3: 情绪回应
      try {
        log('\n测试 /api/respond...');
        const resp = await fetch(API_BASE + '/api/respond', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mood: 'good', time: '14:30', weather: '', count: 1 }),
          signal: AbortSignal.timeout(5000)
        });
        const data = await resp.json();
        log('✅ 情绪回应成功: ' + JSON.stringify(data));
      } catch (e) {
        log('❌ 情绪回应失败: ' + e.message, true);
      }
    }

    testAPI();
  </script>
</body>
</html>
