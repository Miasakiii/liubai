<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>留白 — AI 健康留白系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;500&display=swap" rel="stylesheet"></noscript>
<style>
  :root {
    --bg: #f7f5f0;
    --text: #2c2c2c;
    --text-light: #9a9a9a;
    --text-muted: #c5c0b8;
    --accent: #c4a882;
    --accent-soft: #e8ddd0;
    --accent-glow: rgba(196, 168, 130, 0.15);
    --white: #ffffff;
    --card: rgba(255,255,255,0.7);
    --shadow-sm: 0 1px 8px rgba(0,0,0,0.03);
    --shadow-md: 0 4px 24px rgba(0,0,0,0.05);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.06);
    --radius: 20px;
    --transition: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { font-size: 16px; }

  body {
    font-family: 'Noto Serif SC', 'Songti SC', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ===== 动画 ===== */
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.06); opacity: 0.8; }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes ripple {
    0% { transform: scale(0); opacity: 0.6; }
    100% { transform: scale(2.5); opacity: 0; }
  }

  @keyframes breatheRing {
    0% { transform: translate(-50%,-50%) scale(1); opacity: 0.3; }
    50% { transform: translate(-50%,-50%) scale(1.4); opacity: 0; }
    100% { transform: translate(-50%,-50%) scale(1); opacity: 0.3; }
  }

  @keyframes breatheCircle {
    0%, 100% { transform: scale(0.85); }
    50% { transform: scale(1); }
  }

  @keyframes dotPulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  @keyframes pageEnter {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes calendarDot {
    from { opacity: 0; transform: scale(0.4); }
    to { opacity: 1; transform: scale(1); }
  }

  /* ===== 页面 ===== */
  .page {
    display: none;
    min-height: 100vh;
    min-height: 100dvh;
    position: relative;
  }

  .page.active {
    display: flex;
    flex-direction: column;
    animation: pageEnter 0.5s var(--transition);
  }

  /* ===== 背景装饰 ===== */
  .bg-orb {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    filter: blur(60px);
  }

  .bg-orb-1 {
    width: 280px; height: 280px;
    background: var(--accent-glow);
    top: 30%; left: 50%;
    transform: translate(-50%, -50%);
    animation: breathe 8s ease-in-out infinite;
  }

  .bg-orb-2 {
    width: 180px; height: 180px;
    background: rgba(126, 184, 201, 0.08);
    top: 60%; left: 30%;
    animation: breathe 10s ease-in-out infinite 2s;
  }

  /* ===== 首页 ===== */
  #page-home {
    justify-content: center;
    align-items: center;
    padding: 40px 24px 100px;
    text-align: center;
  }

  .home-content {
    position: relative;
    z-index: 1;
    max-width: 340px;
    width: 100%;
  }

  .brand {
    font-size: 11px;
    letter-spacing: 8px;
    color: var(--text-muted);
    margin-bottom: 72px;
    text-transform: uppercase;
    animation: fadeIn 1s ease;
  }

  /* 今日一句 */
  .daily-quote {
    font-size: 15px;
    font-weight: 300;
    color: var(--text-light);
    letter-spacing: 1px;
    margin-bottom: 48px;
    line-height: 1.8;
    opacity: 0;
    animation: slideUp 0.8s var(--transition) 0.3s both;
    cursor: default;
    transition: opacity 0.5s ease;
    position: relative;
  }

  .daily-quote::before,
  .daily-quote::after {
    content: '';
    display: block;
    width: 20px;
    height: 1px;
    background: var(--text-muted);
    margin: 0 auto 16px;
    opacity: 0.4;
  }

  .daily-quote::after {
    margin: 16px auto 0;
  }

  .daily-quote.hidden {
    opacity: 0;
    height: 0;
    margin: 0;
    overflow: hidden;
    transition: all 0.5s ease;
  }

  .daily-quote .fav-btn {
    display: inline-block;
    margin-top: 12px;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    border: none;
    background: none;
    font-family: inherit;
    padding: 4px 8px;
    transition: all 0.3s;
    letter-spacing: 1px;
  }

  .daily-quote .fav-btn:hover { color: var(--accent); }
  .daily-quote .fav-btn.active { color: #e8868a; }

  .home-question {
    font-size: 28px;
    font-weight: 200;
    line-height: 1.5;
    margin-bottom: 56px;
    letter-spacing: 2px;
    animation: slideDown 0.8s var(--transition) 0.2s both;
  }

  .mood-row {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 48px;
    animation: fadeIn 0.6s ease 0.5s both;
  }

  .mood-btn {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: none;
    background: var(--card);
    backdrop-filter: blur(8px);
    font-size: 26px;
    cursor: pointer;
    transition: all 0.35s var(--transition);
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }

  .mood-btn:hover {
    transform: translateY(-4px) scale(1.08);
    box-shadow: var(--shadow-md);
    background: var(--white);
  }

  .mood-btn:active {
    transform: translateY(0) scale(0.95);
    transition-duration: 0.1s;
  }

  .mood-btn .ripple-effect {
    position: absolute;
    width: 100%; height: 100%;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.3;
    animation: ripple 0.5s ease-out forwards;
    pointer-events: none;
  }

  .skip-btn {
    font-size: 13px;
    color: var(--text-light);
    cursor: pointer;
    border: none;
    background: none;
    font-family: inherit;
    padding: 8px 16px;
    transition: all 0.3s;
    animation: fadeIn 0.6s ease 0.8s both;
    -webkit-tap-highlight-color: transparent;
    border-bottom: 1px solid transparent;
  }

  .skip-btn:hover {
    color: var(--text);
    border-bottom-color: var(--text-muted);
  }

  .home-footer {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1px;
    animation: fadeIn 1s ease 1s both;
  }

  /* ===== AI 回应页 ===== */
  #page-response {
    justify-content: flex-start;
    align-items: center;
    padding: 80px 28px 100px;
  }

  .resp-container {
    max-width: 380px;
    width: 100%;
    text-align: center;
  }

  .resp-emoji {
    font-size: 52px;
    margin-bottom: 48px;
    animation: float 5s ease-in-out infinite;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.06));
  }

  .resp-text {
    font-size: 17px;
    font-weight: 300;
    line-height: 2;
    letter-spacing: 0.5px;
    margin-bottom: 36px;
    min-height: 100px;
  }

  .resp-line {
    opacity: 0;
    animation: slideUp 0.6s var(--transition) forwards;
    margin-bottom: 4px;
  }

  .resp-line:nth-child(1) { animation-delay: 0.4s; }
  .resp-line:nth-child(2) { animation-delay: 1.1s; }
  .resp-line:nth-child(3) { animation-delay: 1.8s; }
  .resp-line:nth-child(4) { animation-delay: 2.5s; }
  .resp-line:nth-child(5) { animation-delay: 3.2s; }

  /* 加载状态 */
  .loading-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 40px 0;
  }

  .loading-dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: dotPulse 1.2s ease-in-out infinite;
  }

  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  /* 呼吸引导 */
  .breath-guide {
    display: none;
    margin: 32px auto;
    width: 140px;
    height: 140px;
    position: relative;
    animation: scaleIn 0.6s var(--transition);
  }

  .breath-guide.active { display: block; }

  .breath-circle {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, var(--accent-soft), var(--accent));
    animation: breatheCircle 12s ease-in-out infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 40px var(--accent-glow);
  }

  .breath-label {
    font-size: 14px;
    font-weight: 300;
    color: var(--text);
    letter-spacing: 2px;
  }

  .breath-ring {
    position: absolute;
    top: 50%; left: 50%;
    width: 100%; height: 100%;
    border-radius: 50%;
    border: 1px solid var(--accent);
    animation: breatheRing 4s ease-in-out infinite;
  }

  /* 呼吸类型选择 */
  .breath-selector {
    display: none;
    margin: 24px auto;
    max-width: 280px;
    animation: scaleIn 0.4s var(--transition);
  }

  .breath-selector.active { display: block; }

  .breath-option {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    margin-bottom: 8px;
    background: var(--card);
    backdrop-filter: blur(12px);
    border-radius: 14px;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: all 0.3s var(--transition);
    border: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }

  .breath-option:hover {
    background: var(--white);
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
  }

  .breath-option:active {
    transform: scale(0.98);
  }

  .breath-option-icon {
    font-size: 20px;
    margin-right: 12px;
    width: 32px;
    text-align: center;
  }

  .breath-option-info {
    flex: 1;
  }

  .breath-option-name {
    font-size: 14px;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 2px;
  }

  .breath-option-desc {
    font-size: 11px;
    color: var(--text-light);
  }

  .breath-rounds {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 12px;
    text-align: center;
    letter-spacing: 1px;
  }

  /* 音频播放器 */
  .player-card {
    display: none;
    margin: 24px auto;
    padding: 14px 20px;
    background: var(--card);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    box-shadow: var(--shadow-sm);
    max-width: 260px;
    animation: scaleIn 0.4s var(--transition);
  }

  .player-card.active { display: block; }

  .player-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .player-name {
    font-size: 13px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .player-icon {
    font-size: 16px;
  }

  .player-duration {
    font-size: 11px;
    color: var(--text-light);
    font-variant-numeric: tabular-nums;
  }

  .player-bar {
    width: 100%;
    height: 2px;
    background: var(--accent-soft);
    border-radius: 1px;
    overflow: hidden;
  }

  .player-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 1px;
    width: 0%;
    transition: width 1s linear;
  }

  /* 情绪歌单卡片 */
  .song-card {
    display: none;
    margin: 24px auto;
    padding: 14px 20px;
    background: var(--card);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    box-shadow: var(--shadow-sm);
    max-width: 260px;
    animation: scaleIn 0.4s var(--transition);
    align-items: center;
    justify-content: space-between;
  }

  .song-card.active { display: flex; }

  .song-info {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
  }

  .song-icon { font-size: 18px; }

  .song-detail { min-width: 0; }

  .song-name {
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .song-artist {
    font-size: 11px;
    color: var(--text-light);
  }

  .song-link {
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
    white-space: nowrap;
    padding: 6px 12px;
    border-radius: 12px;
    transition: all 0.3s;
    letter-spacing: 0.5px;
  }

  .song-link:hover {
    background: var(--accent-soft);
  }

  /* 情绪树洞 */
  .tree-hole-entry {
    margin: 20px auto 0;
    text-align: center;
    animation: fadeInUp 0.6s var(--transition);
  }

  .tree-hole-entry span {
    font-size: 14px;
    color: var(--text-muted);
    cursor: pointer;
    letter-spacing: 1px;
    transition: color 0.3s;
  }

  .tree-hole-entry span:hover {
    color: var(--text-light);
  }

  .tree-hole-box {
    display: none;
    margin: 12px auto 0;
    max-width: 280px;
    animation: scaleIn 0.4s var(--transition);
  }

  .tree-hole-box.active { display: block; }

  .tree-hole-box textarea {
    width: 100%;
    min-height: 80px;
    padding: 12px 14px;
    border: 1px solid var(--accent-soft);
    border-radius: 12px;
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    line-height: 1.6;
    letter-spacing: 0.5px;
  }

  .tree-hole-box textarea::placeholder {
    color: var(--text-muted);
  }

  .tree-hole-actions {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 10px;
  }

  .tree-hole-actions button {
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    border: none;
    background: none;
    font-family: inherit;
    padding: 6px 16px;
    border-radius: 10px;
    transition: all 0.3s;
    letter-spacing: 1px;
  }

  .tree-hole-actions button:hover {
    background: var(--accent-soft);
    color: var(--text);
  }

  .tree-hole-hint {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
    opacity: 0.6;
  }

  /* 树洞日历标记 */
  .cal-day .tree-dot {
    display: inline-block;
    width: 4px;
    height: 4px;
    background: var(--accent);
    border-radius: 50%;
    margin-left: 2px;
    vertical-align: middle;
  }

  /* 树洞查看浮层 */
  .tree-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }

  .tree-overlay.active { display: flex; }

  .tree-overlay-box {
    background: var(--white);
    border-radius: 20px;
    padding: 28px 24px;
    max-width: 300px;
    width: 85%;
    box-shadow: 0 8px 40px rgba(0,0,0,0.15);
    animation: scaleIn 0.3s var(--transition);
  }

  .tree-overlay-title {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 16px;
    text-align: center;
    letter-spacing: 1px;
  }

  .tree-overlay-content {
    font-size: 15px;
    color: var(--text);
    line-height: 1.8;
    margin-bottom: 20px;
    white-space: pre-wrap;
  }

  .tree-overlay-close {
    display: block;
    margin: 0 auto;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    border: none;
    background: none;
    font-family: inherit;
    padding: 6px 20px;
    border-radius: 10px;
    transition: all 0.3s;
    letter-spacing: 1px;
  }

  .tree-overlay-close:hover {
    background: var(--accent-soft);
  }

  /* 收藏按钮（回应页） */
  .resp-fav-btn {
    display: inline-block;
    margin-top: 16px;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    border: none;
    background: none;
    font-family: inherit;
    padding: 6px 12px;
    transition: all 0.3s;
    letter-spacing: 1px;
  }

  .resp-fav-btn:hover { color: var(--accent); }
  .resp-fav-btn.active { color: #e8868a; }

  /* 收藏列表 */
  .cal-fav-btn {
    position: absolute;
    top: 64px;
    right: 24px;
    font-size: 18px;
    cursor: pointer;
    border: none;
    background: none;
    padding: 8px;
    transition: transform 0.3s;
    -webkit-tap-highlight-color: transparent;
  }

  .cal-fav-btn:hover { transform: scale(1.15); }

  .fav-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(247,245,240,0.96);
    backdrop-filter: blur(20px);
    z-index: 200;
    overflow-y: auto;
    padding: 64px 24px 100px;
    animation: fadeIn 0.3s ease;
  }

  .fav-overlay.active { display: block; }

  .fav-header {
    text-align: center;
    margin-bottom: 32px;
  }

  .fav-title {
    font-size: 20px;
    font-weight: 200;
    letter-spacing: 4px;
    margin-bottom: 8px;
  }

  .fav-close {
    font-size: 12px;
    color: var(--text-light);
    cursor: pointer;
    border: none;
    background: none;
    font-family: inherit;
    padding: 8px;
    letter-spacing: 1px;
  }

  .fav-close:hover { color: var(--text); }

  .fav-list {
    max-width: 380px;
    margin: 0 auto;
  }

  .fav-item {
    padding: 16px 0;
    border-bottom: 1px solid rgba(0,0,0,0.04);
    animation: slideUp 0.3s var(--transition) both;
  }

  .fav-item-text {
    font-size: 14px;
    font-weight: 300;
    line-height: 1.8;
    color: var(--text);
    margin-bottom: 6px;
  }

  .fav-item-date {
    font-size: 11px;
    color: var(--text-muted);
  }

  .fav-item-remove {
    font-size: 11px;
    color: var(--text-muted);
    cursor: pointer;
    border: none;
    background: none;
    font-family: inherit;
    padding: 2px 6px;
    margin-left: 8px;
    transition: color 0.3s;
  }

  .fav-item-remove:hover { color: #e8868a; }

  .fav-empty {
    text-align: center;
    font-size: 14px;
    color: var(--text-light);
    padding: 40px 0;
    font-weight: 300;
  }

  /* ===== 晚安模式 ===== */
  body.goodnight {
    --bg: #1a1a2e;
    --text: #d4d0c8;
    --text-light: #8a8698;
    --text-muted: #4a4660;
    --accent: #6b5b8a;
    --accent-soft: #2a2640;
    --accent-glow: rgba(107, 91, 138, 0.15);
    --card: rgba(40, 36, 60, 0.7);
    --white: #2a2640;
    --shadow-sm: 0 1px 8px rgba(0,0,0,0.15);
    --shadow-md: 0 4px 24px rgba(0,0,0,0.2);
  }

  body.goodnight .home-question { font-weight: 300; }

  body.goodnight .onboarding-overlay {
    background: rgba(26, 26, 46, 0.95);
  }

  /* 完成按钮 */
  .done-btn {
    margin-top: 44px;
    padding: 12px 36px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 2px;
    border-radius: 28px;
    cursor: pointer;
    transition: all 0.35s var(--transition);
    opacity: 0;
    animation: fadeIn 0.5s ease 3.5s forwards;
    -webkit-tap-highlight-color: transparent;
  }

  .done-btn:hover {
    background: var(--accent);
    color: var(--white);
    box-shadow: var(--shadow-md);
  }

  /* ===== 日历页 ===== */
  #page-calendar {

<script>
// ============ 配置 ============
// 自动检测API地址：本地开发用localhost:3001，Vercel部署用相对路径
const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? location.protocol + '//' + location.hostname + ':3001'
  : '';
const STORAGE_KEY = 'liubai_records';

// ============ 数据层 ============
function getRecords() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}

function saveRecord(date, mood) {
  const r = getRecords();
  r[date] = { mood, ts: Date.now() };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(r));
}

function today() {
  return new Date().toISOString().split('T')[0];
}

function todayCount() {
  return getRecords()[today()] ? 1 : 0;
}

// ============ 收藏数据 ============
const FAV_KEY = 'liubai_favorites';

function getFavorites() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; }
  catch { return []; }
}

function saveFavorites(favs) {
  localStorage.setItem(FAV_KEY, JSON.stringify(favs));
}

function isFavorited(text) {
  return getFavorites().some(f => f.text === text);
}

function toggleFavorite(text) {
  const favs = getFavorites();
  const idx = favs.findIndex(f => f.text === text);
  if (idx >= 0) {
    favs.splice(idx, 1);
  } else {
    favs.unshift({ text, date: today() });
  }
  saveFavorites(favs);
  return idx < 0; // true = added, false = removed
}

// ============ 情绪映射 ============
const MOOD = {
  great:   { e: '😊', label: '很好' },
  good:    { e: '🙂', label: '还好' },
  neutral: { e: '😐', label: '一般' },
  low:     { e: '😔', label: '不好' },
  bad:     { e: '😫', label: '很累' },
  skip:    { e: '🌙', label: '不说' }
};

const AUDIO_ICONS = {
  '雨声': '🌧', '海浪': '🌊', '壁炉': '🔥', '风铃': '🎐', '深夜书店': '📚'
};

// ============ 今日一句 ============
const DAILY_QUOTES = [
  '今天的风，好像有点甜。',
  '不好不坏，也是一种状态。',
  '有些天就是用来浪费的。',
  '不用每天都很好。"还好"已经很努力了。',
  '今天的你，不需要被定义。',
  '给自己三分钟。什么都不用想。',
  '就这样。挺好的。',
  '不想说话的时候，沉默也是一种回答。',
  '不用给自己的心情找原因。它在就好。',
  '去接杯水吧。站着喝，别坐着。',
  '今天的任务只有一个：活着。其他都算赚到。',
  '累了就休息。不是偷懒，是必要的。',
  '你不是机器。机器都需要充电。',
  '坏情绪不是你的错。它只是来了。',
  '你已经做得比你以为的多了。',
  '有些天就是比较难。但你会过来的。',
  '平凡的一天，也是只属于你的一天。',
  '好日子不用多。有一条就够记住这个月了。',
  '不想动的话，就坐着。坐着也是一种休息。',
  '做完就去睡。明天的事明天再说。'
];

function getTodayQuote() {
  const todayKey = new Date().toISOString().split('T')[0];
  const stored = localStorage.getItem('liubai_quote');
  if (stored) {
    try {
      const { date, index } = JSON.parse(stored);
      if (date === todayKey && DAILY_QUOTES[index]) return DAILY_QUOTES[index];
    } catch {}
  }
  // 基于日期的确定性索引，确保同一天不重复
  const seed = todayKey.split('-').reduce((a, b) => a + parseInt(b), 0);
  const index = seed % DAILY_QUOTES.length;
  localStorage.setItem('liubai_quote', JSON.stringify({ date: todayKey, index }));
  return DAILY_QUOTES[index];
}

// ============ 情绪歌单 ============
const MOOD_SONGS = {

// 获取天气（缓存在 localStorage，30 分钟有效）
async function fetchWeather() {
  try {
    const cached = localStorage.getItem('liubai_weather');
    if (cached) {
      const { data, ts } = JSON.parse(cached);
      if (Date.now() - ts < 30 * 60 * 1000 && data && data.text) return data;
    }

    const resp = await fetch(API_BASE + '/api/weather', { signal: AbortSignal.timeout(3000) });
    const data = await resp.json();
    if (data && data.text) {
      localStorage.setItem('liubai_weather', JSON.stringify({ data, ts: Date.now() }));
      return data;
    }
    return null;
  } catch { return null; }
}

// 获取AI响应
async function fetchAIResponse(mood) {
  try {
    const now = new Date();
    const timeStr = now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');

    // 并行获取天气和 AI 响应
    const weather = await fetchWeather();
    const weatherStr = weather ? `${weather.text} ${weather.temp}°C` : '';
    const goodnight = isGoodnightEnabled() && isGoodnightTime();

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 3000);

    const resp = await fetch(API_BASE + '/api/respond', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mood,
        time: goodnight ? timeStr + '（深夜，优先推荐休息）' : timeStr,
        weather: weatherStr,
        count: todayCount()
      }),
      signal: controller.signal
    });

    clearTimeout(timeoutId);
    return await resp.json();
  } catch (e) {
    return null;
  }
}

};

let currentAudio = null;
let audioTimer = null;

function startAudio(name) {
  stopAudio();

  const url = AUDIO_URLS[name] || AUDIO_URLS['雨声'];
  const audio = new Audio(url);
  audio.loop = true;
  audio.volume = 0.4;

  audio.play().catch(() => {
    // 如果在线音频失败，使用本地生成
    startLocalAudio(name);
  });

  currentAudio = audio;

  // 进度条
  let sec = 0;
  const total = 90;
  const fill = document.getElementById('playerFill');
  const timeEl = document.getElementById('playerTime');

  if (audioTimer) clearInterval(audioTimer);
  audioTimer = setInterval(() => {
    sec++;
    fill.style.width = (sec / total * 100) + '%';
    const rem = total - sec;
    timeEl.textContent = Math.floor(rem / 60) + ':' + String(rem % 60).padStart(2, '0');
    if (sec >= total) {
      stopAudio();
      reportSocialHint('whiteNoise', name);
      triggerSocialHint('whiteNoise', name);
    }
  }, 1000);
}

// 本地生成备用方案
function startLocalAudio(name) {
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const ctx = new AudioCtx();
  const bufferSize = ctx.sampleRate * 2;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);

  // 生成粉红噪音作为基础
  for (let i = 0; i < bufferSize; i++) {
    const white = Math.random() * 2 - 1;
    data[i] = (data[i-1] || 0) * 0.97 + white * 0.03;
  }

  const source = ctx.createBufferSource();
  source.buffer = buffer;
  source.loop = true;

  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 800;

  const gain = ctx.createGain();
  gain.gain.value = 0.3;

  source.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  source.start();

  currentAudio = { stop: () => { try { source.stop(); } catch(e) {} } };
}

function stopAudio() {
  if (currentAudio) {
    try {
      currentAudio.pause();
      currentAudio.currentTime = 0;
    } catch(e) {}
    currentAudio = null;
  }
  if (audioTimer) {
    clearInterval(audioTimer);
    audioTimer = null;
  }
}

function simulatePlayer(name) {
  startAudio(name || '雨声');
}

const TREE_HOLE_KEY = 'liubai_tree_hole';

function getTreeHoleData() {
  try { return JSON.parse(localStorage.getItem(TREE_HOLE_KEY) || '{}'); }
  catch { return {}; }
}

function getTodayTreeHoleCount() {
  const data = getTreeHoleData();
  const today = new Date().toISOString().slice(0, 10);
  return (data[today] || []).length;
}

function toggleTreeHole() {
  const box = document.getElementById('treeHoleBox');
  box.classList.toggle('active');
  if (box.classList.contains('active')) {
    document.getElementById('treeHoleText').focus();
  }
}

function saveTreeHole() {
  const text = document.getElementById('treeHoleText').value.trim();
  if (!text) return;
  if (getTodayTreeHoleCount() >= 3) {
    document.querySelector('.tree-hole-hint').textContent = '今天已经写了 3 条了，明天再来吧';
    return;
  }
  const today = new Date().toISOString().slice(0, 10);
  const data = getTreeHoleData();
  if (!data[today]) data[today] = [];
  data[today].push({ content: text, ts: Date.now() });
  localStorage.setItem(TREE_HOLE_KEY, JSON.stringify(data));
  document.getElementById('treeHoleText').value = '';
  document.getElementById('treeHoleBox').classList.remove('active');
}

function discardTreeHole() {
  document.getElementById('treeHoleText').value = '';
  document.getElementById('treeHoleBox').classList.remove('active');
}

function showTreeOverlay(dateKey) {
  const data = getTreeHoleData();
  const entries = data[dateKey];
  if (!entries || !entries.length) return;
  document.getElementById('treeOverlayTitle').textContent = `🌳 ${dateKey} 的树洞`;
  document.getElementById('treeOverlayContent').textContent = entries.map(e => e.content).join('\n\n');
  document.getElementById('treeOverlay').classList.add('active');
}

// ============ 漂流瓶 ============
const DRIFT_KEY = 'liubai_drift_bottles';
const DRIFT_ANON_TAGS = [
  '某个也醒着的人', '某个路过的人', '某个也在听雨的人',
  '某个今天也不太好的人', '某个刚刚做完呼吸的人',
  '某个还在加班的人', '某个早起的人', '某个还没睡的人',
];
const DRIFT_CONTENT_POOL = [
  '今天也辛苦了。', '明天会好的。', '你已经很棒了。',
  '深呼吸，没事的。', '今天也好好吃饭了吗？',
  '偶尔停下来也没关系。', '雨会停的。',
  '谢谢你还在坚持。', '今天也辛苦了，早点休息。',
  '世界很大，但此刻只需要安静。', '给自己一个拥抱吧。',
  '不开心的事，睡一觉就过去了。', '你值得被温柔对待。',
  '慢慢来，比较快。', '今天的月亮很好看。',
  '喝杯热水吧。', '你不是一个人。',
  '明天也要好好的。', '一切都会好起来的。',
  '累了就休息，不用勉强。', '今天的风很舒服。',
  '你已经很努力了。', '相信自己。',
  '生活总有不期而遇的温暖。', '愿你被世界温柔以待。',
];

function getDriftData() {
  try { return JSON.parse(localStorage.getItem(DRIFT_KEY) || '{"sent":{},"received":{}}'); }
  catch { return { sent: {}, received: {} }; }
}

function saveDriftData(data) {
  localStorage.setItem(DRIFT_KEY, JSON.stringify(data));
}

function isDriftNewUser() {
  const records = getRecords();
  const dates = Object.keys(records).sort();
  if (dates.length === 0) return true;
  const first = new Date(dates[0]);
  const now = new Date();
  return (now - first) < 3 * 24 * 60 * 60 * 1000;
}

function getRandomDriftContent() {
  return DRIFT_CONTENT_POOL[Math.floor(Math.random() * DRIFT_CONTENT_POOL.length)];
}

function getRandomTag() {
  return DRIFT_ANON_TAGS[Math.floor(Math.random() * DRIFT_ANON_TAGS.length)];
}

function openDriftBottle() {
  if (isDriftNewUser()) {
    alert('先用几天再来玩漂流瓶吧 🌊');
    return;
  }
  const today = new Date().toISOString().slice(0, 10);
  const data = getDriftData();

  // 获取今天的接收瓶子
  const received = data.received[today] || [];
  while (received.length < 3) {
    received.push({ content: getRandomDriftContent(), tag: getRandomTag() });
  }
  data.received[today] = received;
  saveDriftData(data);

  // 检查今天是否已发送
  const sentToday = data.sent[today];

  let html = '<div style="margin-bottom:16px">';
  received.forEach(b => {
    html += `<div style="padding:10px 14px;margin-bottom:8px;background:var(--accent-soft);border-radius:12px;font-size:14px;color:var(--text);line-height:1.6">
      ${b.content}<br><span style="font-size:11px;color:var(--text-muted)">— ${b.tag}</span>
    </div>`;
  });
  html += '</div>';

  if (sentToday) {
    html += '<div style="text-align:center;font-size:13px;color:var(--text-muted);letter-spacing:0.5px">已经扔了？明天再来。</div>';
  } else {
    html += `<div style="margin-top:12px">
      <textarea id="driftInput" maxlength="50" placeholder="写一句话，扔进海里" style="width:100%;min-height:60px;padding:10px 12px;border:1px solid var(--accent-soft);border-radius:12px;background:var(--card);color:var(--text);font-size:14px;font-family:inherit;resize:none;outline:none;line-height:1.6"></textarea>
      <div style="text-align:center;margin-top:8px"><button onclick="sendDriftBottle()" style="font-size:13px;color:var(--accent);cursor:pointer;border:none;background:none;font-family:inherit;padding:6px 16px;border-radius:10px;letter-spacing:1px">扔进海里 🌊</button></div>
    </div>`;
  }

  document.getElementById('driftContent').innerHTML = html;
  document.getElementById('driftOverlay').classList.add('active');
}

function sendDriftBottle() {
  const input = document.getElementById('driftInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  const today = new Date().toISOString().slice(0, 10);
  const data = getDriftData();
  data.sent[today] = { content: text, ts: Date.now() };
  saveDriftData(data);
  openDriftBottle(); // 刷新显示
}

function closeDriftOverlay(e) {
  if (e && e.target !== document.getElementById('driftOverlay')) return;
  document.getElementById('driftOverlay').classList.remove('active');
}

// ============ 社群暗示 ============
const HINT_COUNT_KEY = 'liubai_hint_count';
const HINT_DATE_KEY = 'liubai_hint_date';
const SOCIAL_HINT_SETTING_KEY = 'liubai_social_hint';

function isSocialHintEnabled() {
  return localStorage.getItem(SOCIAL_HINT_SETTING_KEY) !== 'off';
}

function getTodayHintCount() {
  const today = new Date().toISOString().slice(0, 10);
  if (localStorage.getItem(HINT_DATE_KEY) !== today) {
    localStorage.setItem(HINT_DATE_KEY, today);
    localStorage.setItem(HINT_COUNT_KEY, '0');
    return 0;
  }
  return parseInt(localStorage.getItem(HINT_COUNT_KEY) || '0', 10);
}

function incrementHintCount() {
  const today = new Date().toISOString().slice(0, 10);
  localStorage.setItem(HINT_DATE_KEY, today);
  localStorage.setItem(HINT_COUNT_KEY, String(getTodayHintCount() + 1));
}

function isNewUserForHint() {
  const records = getRecords();
  const dates = Object.keys(records).sort();
  if (dates.length === 0) return true;
  const first = new Date(dates[0]);
  return (new Date() - first) < 3 * 24 * 60 * 60 * 1000;
}

function isLateNight() {
  const h = new Date().getHours();
  return h >= 22 || h < 6;
}

async function fetchSocialHint(type, value) {
  try {
    const res = await fetch(`${API_BASE}/api/social-hint?type=${type}&value=${value || ''}`);
    const data = await res.json();
    return data.message || '';
  } catch {
    // 离线降级：随机估算
    const count = Math.floor(Math.random() * 400) + 100;
    const TEMPLATES = {
      whiteNoise: '今天有 ' + count + ' 人也选择了听' + (value || '白噪音'),
      breathing: '今天有 ' + count + ' 人也做了呼吸引导',
      silentMode: '今天有 ' + count + ' 人也没说话',
      lateNight: '现在有 ' + count + ' 人也醒着',
    };
    return TEMPLATES[type] || '';
  }
}

function reportSocialHint(type, value) {
  fetch(`${API_BASE}/api/social-hint/report`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type, value }),
  }).catch(() => {});
}

function showSocialHintEl(message) {
  // 移除旧的暗示
  const old = document.querySelector('.social-hint-line');
  if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'social-hint-line';
  el.style.cssText = 'font-size:13px;color:var(--text-muted);text-align:center;margin:12px 0;opacity:0;transition:opacity 0.6s;letter-spacing:0.5px';
  el.textContent = message;
  const doneBtn = document.querySelector('.done-btn');
  if (doneBtn) doneBtn.parentNode.insertBefore(el, doneBtn);
  requestAnimationFrame(() => { el.style.opacity = '1'; });
}

async function triggerSocialHint(type, value) {
  if (!isSocialHintEnabled()) return;
  if (isNewUserForHint()) return;
  if (getTodayHintCount() >= 2) return;
  const message = await fetchSocialHint(type, value);
  if (message) {
    showSocialHintEl(message);
    incrementHintCount();
  }
}

// ============ 日历 ============
function renderCalendar() {
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();
  const d = now.getDate();
  const months = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

  document.getElementById('calMonth').textContent = months[m];

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  ['一','二','三','四','五','六','日'].forEach(w => {
    const el = document.createElement('div');
    el.className = 'cal-weekday';
    el.textContent = w;
    grid.appendChild(el);
  });

  const first = new Date(y, m, 1).getDay();
  const offset = first === 0 ? 6 : first - 1;
  const days = new Date(y, m + 1, 0).getDate();
  const records = getRecords();

  for (let i = 0; i < offset; i++) {
    const el = document.createElement('div');
    el.className = 'cal-day';
    grid.appendChild(el);
  }

  for (let i = 1; i <= days; i++) {
    const el = document.createElement('div');
    el.className = 'cal-day';
    el.style.animationDelay = `${(i + offset) * 0.02}s`;

    const key = `${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    const rec = records[key];
    const treeData = getTreeHoleData();
    const hasTree = treeData[key] && treeData[key].length > 0;

    if (i > d) {
      el.textContent = i;
      el.classList.add('future');
    } else if (rec && MOOD[rec.mood]) {
      el.innerHTML = MOOD[rec.mood].e + (hasTree ? '<span class="tree-dot"></span>' : '');
      el.classList.add('has-data');
      if (hasTree) {
        el.style.cursor = 'pointer';
        el.onclick = () => showTreeOverlay(key);
      }
    } else {
      el.innerHTML = '<span class="dot"></span>' + (hasTree ? '<span class="tree-dot"></span>' : '');
      if (hasTree) {
        el.style.cursor = 'pointer';
        el.onclick = () => showTreeOverlay(key);
      }
    }

    if (i === d) el.classList.add('is-today');

    grid.appendChild(el);
  }

  // 总结
  const monthRecs = Object.entries(records).filter(([k]) =>
    k.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)
  );
  const total = monthRecs.length;
  const good = monthRecs.filter(([,r]) => ['great','good'].includes(r.mood)).length;
  const bad = monthRecs.filter(([,r]) => ['low','bad'].includes(r.mood)).length;
  const neutral = monthRecs.filter(([,r]) => ['neutral','skip'].includes(r.mood)).length;

  // 离线总结
  let summary = '';
  if (total === 0) {
    summary = '还没有记录。没关系，慢慢来。';
  } else {
    summary = `这个月你来了 ${total} 天。\n`;
    if (good > 0) summary += `有 ${good} 天还不错。`;
    if (bad > 0) summary += `有 ${bad} 天不太好。`;
    if (neutral > 0) summary += `有 ${neutral} 天只是来坐坐。`;
    summary += `\n\n但你每天都来了。这本身就是一种照顾自己。`;
    summary += `\n\n下个月见。不用更好，就这样就好。`;
  }

  // AI 已连接时：先显示加载，等 AI 响应后直接显示
  if (window._aiStatus !== 'offline' && total > 0) {
    document.getElementById('calSummary').innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
    fetchMonthlyReview(monthRecs, y, m + 1);
  } else {
    document.getElementById('calSummary').textContent = summary;
  }
}

// ============ AI 月度回顾 ============
async function fetchMonthlyReview(monthRecs, year, month) {
  try {
    const moodEmojis = { great: '😊', good: '🙂', neutral: '😐', low: '😔', bad: '😫', skip: '🌙' };
    const records = monthRecs.map(([date, r]) => `${date.split('-')[2]}日：${moodEmojis[r.mood] || '·'}`).join(' | ');

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 5000);

    const resp = await fetch(API_BASE + '/api/calendar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ month, records, totalDays: monthRecs.length }),
      signal: controller.signal
    });

    clearTimeout(timeoutId);
    const data = await resp.json();

    if (data && data.text) {
      document.getElementById('calSummary').textContent = data.text;
    }
  } catch {
    // 保持离线总结
  }
}

// ============ AI 状态检查 ============
async function checkAI() {
  const dot = document.getElementById('aiDot');
  const label = document.getElementById('aiLabel');

  // 默认离线状态（立即生效）
  label.textContent = '离线模式';
  window._aiStatus = 'offline';

  try {
    const resp = await fetch(API_BASE + '/api/health', { signal: AbortSignal.timeout(800) });
    const data = await resp.json();
    if (data.ai === 'connected') {
      dot.classList.add('live');
      label.textContent = 'AI · ' + (data.model || '');
      window._aiStatus = 'connected';
    }
  } catch {
    // 保持离线状态
  }
}

  el.innerHTML = `<span class="quote-text">${quote}</span><br><button class="fav-btn ${fav ? 'active' : ''}" onclick="favDailyQuote(this)">${fav ? '❤️ 已收藏' : '♡ 喜欢'}</button>`;

function favDailyQuote(btn) {

}
